apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: msa-dev
rules:
  # 允许 get/list/watch pods（查看 Pod 状态）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # 允许读取 pods/log（查看日志）
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

  # 允许 patch deployments（CI 中更新部署）
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]

  # 允许读取 services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # 允许读取 secrets（如需在 CI 中读取 docker login 凭据）
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # 允许创建/删除 pods（如果需要在 CI 中创建临时 Pod）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]

  # 允许操作 configmaps（如需在 CI 中更新配置）
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: msa-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: msa-dev
